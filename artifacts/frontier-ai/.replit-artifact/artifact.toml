kind = "web"
previewPath = "/"
title = "Denarixx Frontier AI"
description = "A research control plane for running, tracking, and evaluating Denarixx D0 experiments with a portable model-engineering foundation."
version = "1.0.0"
id = "artifacts/frontier-ai"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 20034

[services.development]
run = "pnpm --filter @workspace/frontier-ai run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/frontier-ai", "run", "build" ]
serve = "static"
publicDir = "artifacts/frontier-ai/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "20034"
BASE_PATH = "/"
